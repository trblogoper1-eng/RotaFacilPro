name: Build Rota Fácil Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -q RotaFacilPro_Android_v5_assinatura.zip

      - name: Preparar assinatura permanente
        working-directory: RotaFacilPro_Android_v5
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ROTA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/rotafacilpro.jks

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "stableRelease" not in s:
              s = s.replace(
                  "android {",
                  """android {
    signingConfigs {
        stableRelease {
            storeFile file("${rootDir}/signing/rotafacilpro.jks")
            storePassword System.getenv("ROTA_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ROTA_KEY_ALIAS")
            keyPassword System.getenv("ROTA_KEY_PASSWORD")
        }
    }""",
                  1
              )

          if "signingConfig signingConfigs.stableRelease" not in s:
              s = s.replace(
                  "release {",
                  """release {
            signingConfig signingConfigs.stableRelease""",
                  1
              )

          p.write_text(s)
          PY

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK assinado
        working-directory: RotaFacilPro_Android_v5
        env:
          ROTA_KEYSTORE_PASSWORD: ${{ secrets.ROTA_KEYSTORE_PASSWORD }}
          ROTA_KEY_ALIAS: ${{ secrets.ROTA_KEY_ALIAS }}
          ROTA_KEY_PASSWORD: ${{ secrets.ROTA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Limpar chave do runner
        if: always()
        run: |
          rm -f RotaFacilPro_Android_v5/signing/rotafacilpro.jks

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFacilPro-APK-Assinado
          path: RotaFacilPro_Android_v5/app/build/outputs/apk/release/app-release.apk
