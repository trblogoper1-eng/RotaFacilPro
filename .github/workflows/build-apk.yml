name: Build Rota Fácil Pro V6 HARD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Baixar projeto
        uses: actions/checkout@v4

      - name: 📦 Preparar V6 HARD
        run: |
          echo "📦 Extraindo projeto..."

          unzip -q RotaFacilPro_V6_HARD_1.5.0.zip

          echo ""
          echo "🔎 Procurando projeto Android..."

          PROJECT_DIR=$(dirname "$(find . -type f -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "❌ settings.gradle não encontrado!"
            exit 1
          fi

          echo "✅ Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "📂 Estrutura do projeto:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: ⚙️ Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔨 Compilar APK V6 DEBUG
        run: |
          echo "🚀 Compilando Rota Fácil Pro V6 HARD..."

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: 🔎 Localizar APK
        run: |
          echo "🔎 Procurando APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "❌ APK não encontrado!"
            exit 1
          fi

          echo "✅ APK encontrado:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 📱 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFacilPro-V6-HARD-1.5.0-DEBUG
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
