name: Build Rota Fácil Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -q RotaFacilPro_Android_v3.zip
          cd RotaFacilPro_Android
          chmod +x gradlew || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: RotaFacilPro_Android
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFacilPro-APK
          path: RotaFacilPro_Android/app/build/outputs/apk/debug/app-debug.apk
