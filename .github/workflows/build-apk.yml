name: Build Rota Fácil Pro V6 HARD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar projeto
        uses: actions/checkout@v4

      - name: 📦 Preparar V6 HARD
        run: |
          unzip -q RotaFacilPro_V6_HARD_1.5.0.zip

          echo "Arquivos do projeto:"
          ls -la

          cd RotaFacilPro_V6_HARD_1.5.0

          chmod +x gradlew || true

      - name: ⚙️ Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔨 Compilar APK V6 DEBUG
        working-directory: RotaFacilPro_V6_HARD_1.5.0
        run: |
          gradle assembleDebug --no-daemon

      - name: 📱 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFacilPro-V6-HARD-1.5.0-DEBUG
          path: RotaFacilPro_V6_HARD_1.5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
